<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цепочка слов</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2430;--mute:#8a8f9c;--line:#e3ded2;--acc:#7c4dff;--acc2:#00c9a7;--bad:#e8336d;--key:#fff;--keyink:#1f2430;--shadow:0 2px 0 rgba(0,0,0,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1f232e;--ink:#eef0f6;--mute:#8b91a3;--line:#2c3140;--acc:#8c7fff;--acc2:#2fd4a8;--bad:#ff8a6b;--key:#2a2f3d;--keyink:#eef0f6;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1f232e;--ink:#eef0f6;--mute:#8b91a3;--line:#2c3140;--acc:#8c7fff;--acc2:#2fd4a8;--bad:#ff8a6b;--key:#2a2f3d;--keyink:#eef0f6;--shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:linear-gradient(160deg,#ffe0f0 0%,#e8e0ff 45%,#d2f4ff 100%) fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 6px;gap:8px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.stat{font-size:13px;color:var(--mute)}
.levels{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.goal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:10px}.goal .row{gap:4px}.goal .t{width:30px;height:30px;font-size:16px;border-radius:8px}.goal .lab{margin-bottom:4px}
.goal .lab{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:6px}
.arrow{font-size:18px;color:var(--mute);padding-top:12px}
.row{display:flex;gap:6px}
.t{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--card);border:2px solid var(--line);text-transform:uppercase}
.t.ch{background:var(--acc);border-color:var(--acc);color:#fff}
.t.start{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t.goalt{background:var(--acc2);border-color:var(--acc2);color:#fff}
.t.ghost{color:var(--mute);opacity:.45}
.t.cur{border-color:var(--acc)}
#ladder{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;perspective:700px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0}
.msg{height:20px;text-align:center;font-size:14px;color:var(--bad);font-weight:600}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pp .25s}
@keyframes pp{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#kb{display:flex;flex-direction:column;gap:7px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:40px;height:42px;border:0;border-radius:10px;background:var(--key);color:var(--keyink);font-size:18px;font-weight:700;box-shadow:var(--shadow);text-transform:uppercase;font-family:inherit}
.k:active{transform:translateY(2px);box-shadow:none}
.k.w{max-width:60px;flex:1.5;font-size:15px}
.k.ok{background:var(--acc);color:#fff}
.tools{display:flex;gap:8px}
.tb{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 6px;font-size:14px;font-weight:600;font-family:inherit}
.tb:active{opacity:.6}
#win{position:fixed;inset:0;background:rgba(10,12,20,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#win.on{display:flex}
.card{background:var(--card);border-radius:22px;padding:24px;text-align:center;max-width:320px;width:100%}
.card h2{margin:0 0 6px;font-size:26px}
.card p{margin:4px 0 18px;color:var(--mute);font-size:15px;line-height:1.4}
.big{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;padding:14px;font-size:16px;font-weight:700;font-family:inherit}
.t{transition:background .3s,border-color .3s,color .3s}
.row.new{animation:up .4s cubic-bezier(.2,.9,.3,1)}
.row.new .t{animation:flip .55s cubic-bezier(.3,.7,.3,1) backwards}
.row.new .t:nth-child(2){animation-delay:.08s}.row.new .t:nth-child(3){animation-delay:.16s}.row.new .t:nth-child(4){animation-delay:.24s}
@keyframes up{from{transform:translateY(18px);opacity:0}}
@keyframes flip{0%{transform:rotateX(90deg) scale(.7);opacity:0}60%{transform:rotateX(-14deg) scale(1.1);opacity:1}100%{transform:none}}
.t.typed{animation:tp .2s ease-out}
@keyframes tp{0%{transform:scale(.75)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.t.goalt{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,184,148,0)}50%{box-shadow:0 0 14px 2px rgba(0,184,148,.5)}}
.arrow{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.k{transition:transform .08s,box-shadow .08s}
.chip,.tb,.big{transition:transform .15s,background .25s,color .25s,opacity .2s}
.chip:active,.tb:active,.big:active{transform:scale(.94)}
.msg{animation:fade .3s ease-out}@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.card{animation:cardin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:scale(.6) translateY(30px);opacity:0}}
.cf{position:fixed;left:50%;top:42%;width:9px;height:14px;border-radius:2px;z-index:6;pointer-events:none;animation:cf 1.6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
h1{font-size:25px;font-weight:900;background:linear-gradient(90deg,#ff4d8d,#7c4dff 55%,#00b0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat{color:#6a5fb0;font-weight:700;background:rgba(255,255,255,.7);padding:5px 11px;border-radius:99px}
.chip{background:rgba(255,255,255,.8);border-color:transparent;color:#6a5fb0}
.chip.on{background:linear-gradient(135deg,#ff4d8d,#7c4dff);color:#fff;box-shadow:0 4px 12px rgba(124,77,255,.4)}
.goal{background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid #fff;box-shadow:0 8px 24px rgba(124,77,255,.18)}
.goal .lab{color:#8a7fcf;font-weight:700}
.arrow{color:#ff4d8d}
.t{background:#fff;border-color:#e6deff;color:#3b2f8f;box-shadow:0 3px 0 #ddd3ff}
.t.start{background:linear-gradient(135deg,#ff6b9d,#ff9a3c);border-color:transparent;color:#fff;box-shadow:0 3px 0 #d94d7c}
.t.goalt{background:linear-gradient(135deg,#00d9a0,#00b0ff);border-color:transparent;color:#fff;box-shadow:0 3px 0 #0090c0}
.t.ch{background:linear-gradient(135deg,#7c4dff,#c04dff);border-color:transparent;color:#fff;box-shadow:0 3px 0 #5a35c9}
.t.cur{border-color:#7c4dff;color:#7c4dff;background:#fff}
.t.ghost{color:#c4bbee;opacity:1}
.msg{color:#e8336d;font-weight:700}
.k{background:#fff;color:#3b2f8f;box-shadow:0 3px 0 #d9d1ff}
.k.ok{background:linear-gradient(135deg,#7c4dff,#ff4d8d);color:#fff;box-shadow:0 3px 0 #5a35c9}
.tb{background:rgba(255,255,255,.88);border-color:transparent;color:#4b3fa8;box-shadow:0 3px 0 #ddd5ff}
#win{background:rgba(60,30,120,.5)}
.card{background:#fff;box-shadow:0 20px 60px rgba(124,77,255,.45)}
.card h2{color:#7c4dff}
.big{background:linear-gradient(135deg,#ff4d8d,#7c4dff);box-shadow:0 5px 0 #5a35c9}
#hint,#undo{display:none}.stat:empty{display:none}
.players{display:flex;gap:8px}
.pl{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.65);border:2px solid transparent;border-radius:14px;padding:6px 10px;font-size:14px;color:#6a5fb0;opacity:.7;transition:all .3s}
.pl b{font-weight:800}.pl .sc{margin-left:auto;background:#fff;border-radius:99px;padding:1px 9px;font-weight:800}
.pl em{font-style:normal;font-weight:900;font-size:20px;min-width:26px;text-align:right}
.pl.on{opacity:1;transform:scale(1.04);background:#fff;box-shadow:0 6px 18px rgba(124,77,255,.3)}
.pl.p0.on{border-color:#ff4d8d;color:#e8336d}.pl.p1.on{border-color:#00b0ff;color:#0090c0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
#barfill{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#00d9a0,#ffd23c);transition:width .12s linear}
#barfill.low{background:linear-gradient(90deg,#ff4d4d,#ff9a3c);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.5}}
.boom{position:fixed;left:50%;top:45%;width:60px;height:60px;margin:-30px;border-radius:50%;z-index:7;pointer-events:none;background:radial-gradient(circle,#fff 0%,#ffe066 30%,#ff7a18 60%,rgba(255,40,0,0) 72%);animation:boom .9s ease-out forwards}
@keyframes boom{0%{transform:scale(.2);opacity:1}60%{opacity:1}100%{transform:scale(14);opacity:0}}
.ring{position:fixed;left:50%;top:45%;width:60px;height:60px;margin:-30px;border-radius:50%;border:6px solid #fff;z-index:7;pointer-events:none;animation:ring .8s .1s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(9);opacity:0}}
.sp{position:fixed;left:50%;top:45%;width:12px;height:12px;margin:-6px;border-radius:50%;z-index:7;pointer-events:none;animation:sp 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.quake{animation:quake .6s}
@keyframes quake{10%,50%,90%{transform:translate(-9px,5px)}30%,70%{transform:translate(9px,-6px)}}
#win.lose .card h2{color:#e8336d}
[hidden]{display:none!important}
#menu{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#ffe0f0 0%,#e8e0ff 45%,#d2f4ff 100%)}
#menu.on{display:flex;animation:fade .35s}
.mbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.logo{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
.mt{font-size:36px;margin:0}
.ms{margin:0 0 10px;color:#6a5fb0;font-size:15px;line-height:1.4}
.big.alt{background:#fff;color:#4b3fa8;box-shadow:0 5px 0 #ddd5ff}
.lab2{font-weight:800;color:#6a5fb0}
.lg{justify-content:center;gap:10px}.lg .chip{padding:12px 22px;font-size:16px}
#mm,#mset{display:flex;flex-direction:column;gap:12px}
[data-theme="dark"] body{background:linear-gradient(160deg,#1c1040 0%,#14173d 50%,#0b2742 100%) fixed}
[data-theme="dark"] #menu{background:linear-gradient(160deg,#1c1040 0%,#14173d 50%,#0b2742 100%)}
[data-theme="dark"] .stat,[data-theme="dark"] .chip{background:rgba(255,255,255,.1);color:#cfc7ff}
[data-theme="dark"] .chip.on{background:linear-gradient(135deg,#ff4d8d,#7c4dff);color:#fff}
[data-theme="dark"] .goal{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(0,0,0,.4)}
[data-theme="dark"] .goal .lab,[data-theme="dark"] .ms,[data-theme="dark"] .lab2{color:#b4aaf5}
[data-theme="dark"] .t{background:#262b52;border-color:#3b4178;color:#ece9ff;box-shadow:0 3px 0 #161933}
[data-theme="dark"] .t.start{background:linear-gradient(135deg,#ff6b9d,#ff9a3c);border-color:transparent;color:#fff;box-shadow:0 3px 0 #b83a68}
[data-theme="dark"] .t.goalt{background:linear-gradient(135deg,#00d9a0,#00b0ff);border-color:transparent;color:#fff;box-shadow:0 3px 0 #007aa6}
[data-theme="dark"] .t.ch{background:linear-gradient(135deg,#7c4dff,#c04dff);border-color:transparent;color:#fff;box-shadow:0 3px 0 #4a2bb0}
[data-theme="dark"] .t.cur{border-color:#a99bff;color:#d6ceff;background:#262b52}
[data-theme="dark"] .t.ghost{color:#59609a;background:#20244a}
[data-theme="dark"] .k{background:#2a2f58;color:#ece9ff;box-shadow:0 3px 0 #151832}
[data-theme="dark"] .k.ok{background:linear-gradient(135deg,#7c4dff,#ff4d8d);color:#fff;box-shadow:0 3px 0 #4a2bb0}
[data-theme="dark"] .tb{background:rgba(255,255,255,.1);color:#ddd7ff;box-shadow:0 3px 0 #151832}
[data-theme="dark"] .pl{background:rgba(255,255,255,.07);color:#b9b0f0}
[data-theme="dark"] .pl.on{background:#2a2f58;box-shadow:0 6px 18px rgba(0,0,0,.45)}
[data-theme="dark"] .pl .sc{background:rgba(255,255,255,.15)}
[data-theme="dark"] .bar{background:rgba(255,255,255,.12)}
[data-theme="dark"] .card{background:#222650;box-shadow:0 20px 60px rgba(0,0,0,.6)}
[data-theme="dark"] .card h2{color:#bcaeff}
[data-theme="dark"] .big.alt{background:#2a2f58;color:#ddd7ff;box-shadow:0 5px 0 #151832}
#mmode{display:flex;flex-direction:column;gap:12px}
.pl.p2.on{border-color:#00c9a7;color:#00957a}.pl.p3.on{border-color:#ff9a3c;color:#d9770a}
.players.n3 .pl,.players.n4 .pl{flex-direction:column;gap:2px;padding:5px 3px;font-size:12px;text-align:center;min-width:0;justify-content:center;min-height:58px}
.players.n3 .pl .sc,.players.n4 .pl .sc{margin-left:0}
.players.n3 .pl em,.players.n4 .pl em{font-size:16px;min-width:0;text-align:center}
.pl.out{opacity:.35;text-decoration:line-through;transform:none}
.ban{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:7;font-size:32px;font-weight:900;color:#fff;text-shadow:0 3px 14px rgba(232,51,109,.95),0 0 3px #e8336d;pointer-events:none;animation:banner 1.8s forwards}
.ban small{display:block;font-size:17px;margin-top:4px}
@keyframes banner{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#monl,#mlob{display:flex;flex-direction:column;gap:12px}
#cin{font:900 28px -apple-system,Segoe UI,Roboto,sans-serif;text-align:center;letter-spacing:6px;text-transform:uppercase;border:2px solid #e6deff;border-radius:14px;padding:12px;width:100%;background:#fff;color:#3b2f8f;outline:none}
#cin:focus{border-color:#7c4dff}
.code{font-size:56px;font-weight:900;letter-spacing:10px;color:#7c4dff;padding-left:10px}
[data-theme="dark"] #cin{background:#262b52;border-color:#3b4178;color:#ece9ff}
[data-theme="dark"] .code{color:#bcaeff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-height:700px){.t{width:34px;height:34px;font-size:18px}.k{height:38px}}
</style>
</head>

<div id="app">
 <header><h1>Цепочка слов</h1><div class="stat" id="stat"></div></header>
 <div class="levels" id="levels"></div>
 <div class="players" id="players"></div>

 <div class="goal" id="goal"></div>

 <div class="msg" id="msg"></div>

  <button class="tb" id="undo">↩︎ Отменить</button>
  <button class="tb" id="skip">⟳ Другая</button>
  <button class="tb" id="menuBtn">☰ Меню</button>
 </div>
 <div id="kb"></div>
</div>
<div id="menu" class="on"><div class="mbox"><div class="logo">🔤</div><h1 class="mt">Цепочка слов</h1><p class="ms">Меняйте по одной букве и дойдите до цели раньше, чем кончится время</p><div id="mm"><button class="big" id="start">▶ Старт</button><button class="big alt" id="onl">🌐 Онлайн</button><button class="big alt" id="sets">⚙ Настройки</button></div><div id="mset" hidden><div class="lab2">Язык слов</div><div class="levels lg"><button class="chip" data-g="en">English</button><button class="chip" data-g="ru">Русский</button></div><div class="lab2">Тема</div><div class="levels lg"><button class="chip" data-th="light">☀ Яркая</button><button class="chip" data-th="dark">🌙 Тёмная</button></div><div class="lab2">Язык интерфейса</div><div class="levels lg"><button class="chip" data-ui="ru">Русский</button><button class="chip" data-ui="en">English</button></div><button class="big" id="back">Назад</button></div><div id="mmode" hidden><div class="lab2">Сколько игроков?</div><button class="big" data-n="1">👤 1 игрок</button><button class="big" data-n="2">👥 2 игрока</button><button class="big" data-n="3">👥 3 игрока</button><button class="big" data-n="4">👥 4 игрока</button><button class="big alt" id="back2">Назад</button></div><div id="monl" hidden><div class="lab2" id="ot">Онлайн</div><button class="big" id="mk">Создать комнату</button><div class="lab2" id="or">или</div><input id="cin" maxlength="4" placeholder="КОД" autocomplete="off" autocapitalize="characters"><button class="big" id="jn">Войти по коду</button><div class="msg" id="oerr"></div><button class="big alt" id="back3">Назад</button></div><div id="mlob" hidden><div class="lab2" id="lt2">Код комнаты</div><div class="code" id="codeb">----</div><div class="ms" id="lp"></div><button class="big" id="go">Начать</button><button class="big alt" id="lv">Выйти</button></div></div></div>
<div id="win"><div class="card pop"><h2 id="wt">Готово!</h2><p id="wp"></p><button class="big" id="next">Следующая игра</button></div></div>

  hc.on("close",()=>{if(!online)return;leaveOnline();clearInterval(tmr);done=true;oerr(T[ui].lost)})})}
function hostMove(p,w){if(done||turn!==p||!started)return;const mb=buf,mm=me;me=p;buf=w;submit();buf=mb;me=mm;render()}
function hostSync(){if(!online||!host||!started)return;const s=JSON.stringify([gid,lang,N,start,goal,chain,turn,alive,wins,done,ev]);if(s===lastS)return;lastS=s;const m={t:"s",gid,lang,N,start,goal,chain,turn,alive,wins,done,ev,left:Math.max(0,deadline-Date.now())};conns.forEach(c=>{try{c.send(m)}catch(e){}})}
function applyState(s){if(s.lang!==lang)setLang(s.lang,1);const ng=s.gid!==gid;N=s.N;alive=s.alive;wins=s.wins;
 if(ng){gid=s.gid;start=s.start;goal=s.goal;dT=bfs(goal);chain=[s.start];buf="";$("win").classList.remove("on");$("menu").classList.remove("on")}
 if(s.chain.length>chain.length)fresh=s.chain.length-1;chain=s.chain;if(s.turn!==turn)buf="";turn=s.turn;done=s.done;deadline=Date.now()+s.left;
 clearInterval(tmr);if(!done)tmr=setInterval(tick,100);render();
 if(s.ev&&s.ev.id>lastEv){lastEv=s.ev.id;playEv(s.ev)}}
function playEv(e){if(e.k==="out"){boom();const b=document.createElement("div");b.className="ban";b.innerHTML=T[ui].lose+"<small>"+T[ui].out(e.p+1)+"</small>";document.body.append(b);setTimeout(()=>b.remove(),1900)}
 else if(e.k==="lose"){boom();$("win").classList.add("lose");$("wt").textContent=T[ui].lose;$("wp").textContent=e.w>=0?T[ui].lp(e.p+1,e.w+1):T[ui].ls;setTimeout(()=>$("win").classList.add("on"),900)}
 else if(e.k==="win"){confetti();$("win").classList.remove("lose");$("wt").textContent=T[ui].win(e.p+1);$("wp").textContent=T[ui].wp(chain.length-1,dT[start]);setTimeout(()=>$("win").classList.add("on"),450)}}
$("cin").oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"")};
$("onl").onclick=()=>{$("oerr").textContent="";showMenu("onl")};
$("back3").onclick=()=>showMenu(false);
$("mk").onclick=createRoom;$("jn").onclick=joinRoom;
$("lv").onclick=()=>{leaveOnline();showMenu("onl")};
$("go").onclick=()=>{if(conns.length<1)return;started=true;N=conns.length+1;wins=Array(N).fill(0);first=N-1;$("menu").classList.remove("on");newGame();syncT=setInterval(hostSync,120)};
try{ui=localStorage.getItem("wl_ui")==="en"?"en":"ru"}catch(e){}applyUI();setTheme(th);setLang(lang);showMenu(false);markLang();
</script>
